<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login | GIAL DSR Admin Portal</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&amp;family=IBM+Plex+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-primary-container": "#c4d2ff",
                    "primary": "#003d9b",
                    "tertiary": "#7b2600",
                    "surface-dim": "#ccdaff",
                    "surface-container": "#e9edff",
                    "on-primary": "#ffffff",
                    "surface-container-low": "#f1f3ff",
                    "surface": "#faf9ff",
                    "surface-container-high": "#e1e8ff",
                    "on-tertiary-container": "#ffc6b2",
                    "primary-fixed": "#dae2ff",
                    "secondary-fixed-dim": "#bbc7de",
                    "surface-container-lowest": "#ffffff",
                    "primary-container": "#0052cc",
                    "on-secondary-fixed-variant": "#3b475b",
                    "outline-variant": "#c3c6d6",
                    "tertiary-fixed": "#ffdbcf",
                    "primary-fixed-dim": "#b2c5ff",
                    "outline": "#737685",
                    "tertiary-fixed-dim": "#ffb59b",
                    "secondary": "#535f73",
                    "on-primary-fixed-variant": "#0040a2",
                    "on-error-container": "#93000a",
                    "surface-tint": "#0c56d0",
                    "on-surface-variant": "#434654",
                    "on-error": "#ffffff",
                    "error": "#ba1a1a",
                    "on-background": "#051a3e",
                    "on-surface": "#051a3e",
                    "on-tertiary": "#ffffff",
                    "tertiary-container": "#a33500",
                    "error-container": "#ffdad6",
                    "on-secondary-fixed": "#101c2d",
                    "on-secondary": "#ffffff",
                    "on-primary-fixed": "#001848",
                    "secondary-container": "#d4e0f8",
                    "on-tertiary-fixed-variant": "#812800",
                    "surface-variant": "#d8e2ff",
                    "background": "#faf9ff",
                    "secondary-fixed": "#d7e3fb",
                    "on-secondary-container": "#576377",
                    "inverse-surface": "#1d3054",
                    "surface-bright": "#faf9ff",
                    "inverse-on-surface": "#edf0ff",
                    "surface-container-highest": "#d8e2ff",
                    "on-tertiary-fixed": "#380d00",
                    "inverse-primary": "#b2c5ff"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "spacing": {
                    "sm": "8px",
                    "2xl": "48px",
                    "lg": "24px",
                    "xs": "4px",
                    "xl": "32px",
                    "md": "16px",
                    "3xl": "64px",
                    "base": "4px"
            },
            "fontFamily": {
                    "headline-md": ["DM Sans"],
                    "label-md": ["IBM Plex Sans"],
                    "display-lg": ["DM Sans"],
                    "headline-sm": ["DM Sans"],

                    "label-md": ["12px", {"lineHeight": "16px", "fontWeight": "500"}],
                    "display-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],

        },

<style>
        body {
            background-color: #faf9ff; /* surface */
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        .login-card {
            box-shadow: 0 25px 50px -12px rgba(0, 61, 155, 0.15);
            animation: cardFadeIn 0.6s ease-out;
        }

        @keyframes cardFadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .input-focus-ring:focus {
            outline: none;
            border-color: #003d9b;
            box-shadow: 0 0 0 2px rgba(0, 61, 155, 0.1);
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .airport-shimmer {
            background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0) 100%);
            background-size: 200% 100%;
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
    </style>
</head>
<body class="font-body-md text-on-surface">
<div class="relative min-h-screen w-full flex items-center justify-center overflow-hidden">
<!-- Subtle Atmospheric Background -->
<div class="absolute inset-0 z-0">

<div class="absolute inset-0 bg-gradient-to-tr from-surface via-transparent to-surface-container-high opacity-80"></div>
</div>
<!-- Decorative Elements -->
<div class="absolute top-12 left-12 opacity-10 select-none pointer-events-none">
<span class="material-symbols-outlined text-[120px] text-primary">flight_takeoff</span>
</div>
<div class="absolute bottom-12 right-12 opacity-10 select-none pointer-events-none">
<span class="material-symbols-outlined text-[120px] text-primary">language</span>
</div>
<!-- Login Container -->
<main class="relative z-10 w-full max-w-[380px] px-md">
<!-- Logo Section (Mobile/Top) -->
<div class="flex flex-col items-center mb-xl">
<div class="w-16 h-16 bg-primary rounded-xl flex items-center justify-center mb-md shadow-lg shadow-primary/20">
<span class="material-symbols-outlined text-on-primary text-[32px]" style="font-variation-settings: 'FILL' 1;">shield_person</span>
</div>
</div>
<!-- Main Card -->
<div class="login-card bg-surface-container-lowest p-[36px_40px] rounded-xl border border-outline-variant transition-all duration-300 hover:shadow-xl">
<!-- Header -->
<header class="mb-xl text-center">
<h1 class="font-headline-sm text-headline-sm text-primary mb-xs">GIAL DSR</h1>
<p class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">
                        Admin Portal <span class="mx-1">•</span> Guwahati Airport
                    </p>
</header>
<!-- Form -->
<form class="flex flex-col gap-lg" id="loginForm" onsubmit="return false">
<!-- Email Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="email">Work Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline text-[18px]">mail</span>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-lg pl-[44px] pr-md py-sm font-body-md text-body-md input-focus-ring placeholder:text-outline-variant" id="email" name="email" placeholder="name@gial.in" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center px-1">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<a class="text-[11px] font-label-md text-primary hover:underline transition-all" href="#">Forgot?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline text-[18px]">lock</span>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-lg pl-[44px] pr-md py-sm font-body-md text-body-md input-focus-ring placeholder:text-outline-variant" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Error State (Hidden by default) -->
<div class="flex items-start gap-sm bg-error-container/30 p-sm rounded-lg border border-error/10 animate-pulse" id="errorMessage">
<span class="material-symbols-outlined text-error text-[18px]">gpp_maybe</span>
<p class="font-body-sm text-body-sm text-error leading-tight">
                            Access restricted to Admin and SysAdmin roles.
                        </p>
</div>
<!-- Submit Button -->
<button class="w-full h-12 bg-primary text-on-primary font-headline-sm text-body-lg rounded-lg flex items-center justify-center gap-sm hover:bg-primary-container transition-all duration-300 active:scale-[0.98] shadow-md shadow-primary/20 mt-xs" type="submit">
<span>Sign In</span>
<span class="material-symbols-outlined text-[20px]">login</span>
</button>
</form>
<!-- Additional Security Info -->
<div class="mt-xl pt-lg border-t border-outline-variant flex items-center justify-center gap-xs">
<span class="material-symbols-outlined text-outline text-[14px]">verified_user</span>
<span class="font-label-caps text-label-caps text-outline">SECURE ENCRYPTED CHANNEL</span>
</div>
</div>
<!-- Footer Meta -->
<footer class="mt-xl text-center">
<p class="font-label-md text-label-md text-on-surface-variant">
                    © 2024 Guwahati International Airport Limited.
                </p>
<div class="flex justify-center gap-md mt-sm">
<a class="font-label-caps text-label-caps text-secondary hover:text-primary transition-colors" href="#">Support</a>
<span class="text-outline-variant">•</span>
<a class="font-label-caps text-label-caps text-secondary hover:text-primary transition-colors" href="#">Privacy Policy</a>
</div>
</footer>
</main>
</div>
<!-- Micro-interactions Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('loginForm');
            const submitBtn = form.querySelector('button[type="submit"]');
            
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                
                // Visual feedback for clicking
                submitBtn.classList.add('airport-shimmer');
                submitBtn.innerHTML = `
                    <span class="material-symbols-outlined animate-spin text-[20px]">progress_activity</span>
                    <span>Authenticating...</span>
                `;
                
                // Simulate delay
                setTimeout(() => {
                    submitBtn.classList.remove('airport-shimmer');
                    submitBtn.innerHTML = `
                        <span>Sign In</span>
                        <span class="material-symbols-outlined text-[20px]">login</span>
                    `;
                }, 2000);
            });

            // Smooth parallax on mouse move for the card
            const container = document.querySelector('.relative.min-h-screen');
            const card = document.querySelector('.login-card');

            container.addEventListener('mousemove', (e) => {
                const xAxis = (window.innerWidth / 2 - e.pageX) / 50;
                const yAxis = (window.innerHeight / 2 - e.pageY) / 50;
                card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
            });

            container.addEventListener('mouseleave', () => {
                card.style.transform = `rotateY(0deg) rotateX(0deg)`;
                card.style.transition = 'all 0.5s ease';
            });

            container.addEventListener('mouseenter', () => {
                card.style.transition = 'none';
            });
        });
    </script>
</body></html>
