<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>GIAL DSR - Report Submitted</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&amp;family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        :root {
            --primary-amber: #D4940A;
            --success-verdant: #2E7D32;
        }
        body {
            font-family: 'IBM Plex Serif', serif;
            background-color: #18130a;
            color: #ede1d3;
            margin: 0;
            overflow: hidden;
        }
        .font-hanken { font-family: 'Hanken Grotesk', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Industrial Segmented Progress Bar Look */
        .progress-segment {
            height: 4px;
            background-color: var(--primary-amber);
            position: relative;
        }
        .progress-segment::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            width: 2px;
            background: #18130a;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "primary-container": "#d4940a",
                      "surface-container-low": "#201b12",
                      "outline": "#9e8e7a",
                      "surface-container-highest": "#3b342a",
                      "on-background": "#ede1d3",
                      "surface-container": "#251f16",
                      "surface-variant": "#3b342a",
                      "surface": "#18130a",
                      "on-surface-variant": "#d5c4ae",
                      "surface-bright": "#3f382e",
                      "on-surface": "#ede1d3",
                      "surface-container-high": "#2f2920",
                      "primary": "#ffba3d",
                      "outline-variant": "#514534",
                      "background": "#18130a"
              },
              "borderRadius": {
                      "DEFAULT": "4px",
                      "lg": "8px",
                      "xl": "12px",
                      "full": "9999px",
                      "modal": "56px"
              },
              "spacing": {
                      "xs": "4px",
                      "xl": "32px",
                      "unit": "4px",
                      "sm": "8px",
                      "gutter": "24px",
                      "lg": "24px",
                      "md": "16px",
                      "margin-mobile": "16px",
                      "margin-desktop": "48px"
              },
              "fontFamily": {
                      "body-md": ["IBM Plex Serif"],
                      "body-lg": ["IBM Plex Serif"],
                      "code-md": ["JetBrains Mono"],
                      "label-sm": ["Hanken Grotesk"],
                      "headline-md": ["Hanken Grotesk"],
                      "display-lg": ["Hanken Grotesk"]
              },
              "fontSize": {
                      "body-sm": ["14px", {"lineHeight": "20px"}],
                      "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                      "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                      "code-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                      "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.08em", "fontWeight": "600"}],
                      "headline-md": ["24px", {"lineHeight": "32px", "letterSpacing": "0.02em", "fontWeight": "700"}],
                      "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "800"}]
              }
            },
          },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface">
<!-- BACKGROUND CONTENT (The Report Screen being overlayed) -->
<div class="fixed inset-0 z-0 flex flex-col opacity-20 pointer-events-none">
<!-- TopAppBar Placeholder -->
<header class="flex justify-between items-center w-full px-margin-mobile md:px-margin-desktop h-20 bg-surface border-b border-outline-variant">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary" data-icon="precision_manufacturing">precision_manufacturing</span>
<h1 class="font-headline-md text-headline-md font-bold text-primary">GIAL DSR</h1>
</div>
<span class="material-symbols-outlined text-on-surface-variant" data-icon="sync">sync</span>
</header>
<main class="flex-1 p-margin-desktop grid grid-cols-12 gap-gutter">
<div class="col-span-8 space-y-6">
<div class="h-32 border border-outline-variant bg-surface-container"></div>
<div class="h-64 border border-outline-variant bg-surface-container"></div>
<div class="h-32 border border-outline-variant bg-surface-container"></div>
</div>
<div class="col-span-4 space-y-6">
<div class="h-full border border-outline-variant bg-surface-container"></div>
</div>
</main>
</div>
<!-- SUCCESS MODAL OVERLAY -->
<div class="fixed inset-0 z-50 flex items-center justify-center bg-[#171412]/90 backdrop-blur-sm px-margin-mobile">
<!-- Central Success Container -->
<div class="w-full max-w-xl bg-surface-container-high rounded-modal p-10 flex flex-col items-center text-center border border-outline-variant shadow-2xl relative overflow-hidden transition-all duration-300 scale-100">
<!-- Atmospheric Gradient Detail -->
<div class="absolute top-0 left-1/2 -translate-x-1/2 w-64 h-2 bg-primary-container/20 blur-xl"></div>
<!-- Success Visual Anchor -->
<div class="w-20 h-20 rounded-full bg-[#2E7D32] flex items-center justify-center mb-8 shadow-inner border-4 border-surface-container-high">
<span class="material-symbols-outlined text-white !text-[48px] font-bold" data-icon="check" style="font-variation-settings: 'FILL' 0, 'wght' 700;">check</span>
</div>
<!-- Typography Content -->
<h2 class="font-display-lg text-display-lg text-on-surface mb-4">Report submitted</h2>
<div class="flex flex-col gap-2 mb-10">
<p class="font-body-md text-body-md text-on-surface-variant flex items-center justify-center gap-2">
<span class="font-mono text-primary px-2 py-0.5 bg-surface-container-highest rounded-sm border border-outline-variant">SN-8821-XPR</span>
<span class="font-bold text-[#2E7D32]">PASS</span>
</p>
<div class="flex items-center justify-center gap-2">
<span class="font-label-sm text-label-sm text-outline uppercase tracking-widest">Sample count:</span>
<span class="font-code-md text-code-md text-on-surface font-semibold">12,450</span>
</div>
</div>
<!-- Industrial Separation Line (Editorial Style) -->
<div class="w-full h-px bg-outline-variant mb-10"></div>
<!-- Primary Action -->
<button class="group relative w-full h-[56px] bg-primary-container hover:bg-primary text-on-primary-container font-hanken font-bold text-[16px] tracking-widest rounded-[6px] transition-all duration-150 active:scale-[0.98] flex items-center justify-center gap-3 overflow-hidden" onclick="window.location.reload()">
<span class="relative z-10">BACK TO MACHINES</span>
<span class="material-symbols-outlined relative z-10 transition-transform group-hover:translate-x-1" data-icon="arrow_forward">arrow_forward</span>
<!-- Interaction Shimmer -->
<div class="absolute inset-0 bg-white/10 translate-x-[-100%] group-hover:translate-x-[100%] transition-transform duration-500 ease-in-out"></div>
</button>
<!-- Metadata / Confirmation Detail -->
<div class="mt-6 flex items-center gap-4">
<div class="flex items-center gap-1.5">
<div class="w-2 h-2 rounded-full bg-[#2E7D32] animate-pulse"></div>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase">Synchronized</span>
</div>
<div class="w-1 h-1 rounded-full bg-outline-variant"></div>
<span class="font-label-sm text-label-sm text-outline uppercase">Ref: #GIAL-9932</span>
</div>
</div>
</div>
<!-- Navigation Drawer (Predicted Shared Component) -->
<aside class="fixed inset-y-0 left-0 z-[60] w-80 bg-surface-container border-r border-outline-variant transition-transform duration-300 -translate-x-full lg:translate-x-0 hidden lg:flex flex-col opacity-50">
<div class="p-8 flex flex-col h-full">
<div class="flex items-center gap-4 mb-12">
<div class="w-12 h-12 rounded bg-surface-container-highest border border-outline-variant flex items-center justify-center">
<span class="material-symbols-outlined text-primary" data-icon="account_circle" style="font-variation-settings: 'FILL' 1;">account_circle</span>
</div>
<div>
<h3 class="font-hanken font-bold text-on-surface">ID: 8821</h3>
<p class="text-xs text-outline font-mono uppercase">West Industrial</p>
</div>
</div>
<nav class="flex-1 space-y-1">
<div class="flex items-center gap-4 px-4 py-3 bg-primary-container text-on-primary-container border-l-4 border-primary">
<span class="material-symbols-outlined" data-icon="list_alt">list_alt</span>
<span class="font-label-sm text-label-sm">Machine List</span>
</div>
<div class="flex items-center gap-4 px-4 py-3 text-on-surface-variant hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined" data-icon="assignment_turned_in">assignment_turned_in</span>
<span class="font-label-sm text-label-sm">Active Reports</span>
</div>
<div class="flex items-center gap-4 px-4 py-3 text-on-surface-variant hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined" data-icon="history">history</span>
<span class="font-label-sm text-label-sm">Sync History</span>
</div>
<div class="flex items-center gap-4 px-4 py-3 text-on-surface-variant hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="font-label-sm text-label-sm">Settings</span>
</div>
</nav>
<div class="mt-auto pt-8 border-t border-outline-variant">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-success-verdant text-sm" data-icon="wifi">wifi</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">System Online</span>
</div>
</div>
</div>
</aside>
<script>
        // Micro-interaction for the success icon scaling
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.querySelector('.rounded-modal');
            container.style.opacity = '0';
            container.style.transform = 'scale(0.95) translateY(20px)';
            
            setTimeout(() => {
                container.style.transition = 'all 0.6s cubic-bezier(0.16, 1, 0.3, 1)';
                container.style.opacity = '1';
                container.style.transform = 'scale(1) translateY(0)';
            }, 100);
        });
    </script>
</body></html>
