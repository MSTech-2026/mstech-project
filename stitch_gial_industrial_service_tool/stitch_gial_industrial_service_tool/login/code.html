<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>GIAL DSR - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&amp;family=IBM+Plex+Serif:wght@400&amp;family=JetBrains+Mono&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        body {
            background-color: #18130a; /* bg0 / background from theme */
            color: #ede1d3; /* on-background */
            font-family: 'IBM Plex Serif', serif;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        /* Industrial baseline grid helpers */
        .grid-bg {
            background-image: linear-gradient(#251f16 1px, transparent 1px), linear-gradient(90deg, #251f16 1px, transparent 1px);
            background-size: 24px 24px;
        }

        .input-border-focus:focus-within {
            border-bottom-width: 2px !important;
            border-bottom-color: #ffba3d !important;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-surface": "#ede1d3",
                        "on-secondary-container": "#c3b6ab",
                        "on-tertiary-container": "#003a5f",
                        "on-background": "#ede1d3",
                        "tertiary": "#99cbff",
                        "on-secondary": "#372f27",
                        "outline-variant": "#514534",
                        "outline": "#9e8e7a",
                        "surface-container-highest": "#3b342a",
                        "surface-container-low": "#201b12",
                        "surface-container-lowest": "#120d06",
                        "surface-container": "#251f16",
                        "primary": "#ffba3d",
                        "surface-container-high": "#2f2920",
                        "error-container": "#93000a",
                        "on-primary-container": "#4c3200",
                        "surface-dim": "#18130a",
                        "surface-bright": "#3f382e",
                        "primary-container": "#d4940a",
                        "on-primary": "#432c00",
                        "background": "#18130a",
                        "surface": "#18130a"
                    },
                    "borderRadius": {
                        "DEFAULT": "4px",
                        "lg": "8px",
                        "xl": "12px",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xl": "32px",
                        "gutter": "24px",
                        "lg": "24px",
                        "unit": "4px",
                        "xs": "4px",
                        "margin-mobile": "16px",
                        "margin-desktop": "48px",
                        "sm": "8px",
                        "md": "16px"
                    },
                    "fontFamily": {
                        "metric-xl": ["Hanken Grotesk"],
                        "body-lg": ["IBM Plex Serif"],
                        "display-lg": ["Hanken Grotesk"],
                        "headline-md": ["Hanken Grotesk"],
                        "code-md": ["JetBrains Mono"],
                        "label-sm": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "metric-xl": ["32px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "0.02em", "fontWeight": "700" }],
                        "code-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.08em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background flex items-center justify-center min-h-screen p-margin-mobile overflow-hidden">
<!-- Atmospheric Background Decoration -->
<div class="fixed inset-0 grid-bg opacity-20 pointer-events-none"></div>
<div class="fixed top-0 left-0 w-full h-1 bg-primary/20"></div>
<!-- Main Login Container -->
<main class="relative z-10 w-full max-w-md flex flex-col items-start space-y-xl">
<!-- Header Section -->
<header class="w-full space-y-unit">
<div class="flex items-center space-x-sm mb-md">
<span class="material-symbols-outlined text-primary text-4xl" data-icon="precision_manufacturing">precision_manufacturing</span>
<div class="h-1px flex-grow bg-outline-variant"></div>
</div>
<h1 class="font-display-lg text-display-lg text-on-surface uppercase tracking-tighter">GIAL DSR</h1>
<p class="font-label-sm text-label-sm text-outline uppercase tracking-widest">Daily Service Reporting</p>
</header>
<!-- Form Section -->
<section class="w-full bg-surface-container border border-outline-variant p-lg space-y-lg relative">
<!-- Functional Detail: Asymmetric Corner -->
<div class="absolute top-0 right-0 w-8 h-8 border-t-2 border-r-2 border-primary translate-x-1 -translate-y-1"></div>
<form action="#" class="space-y-lg" onsubmit="return false;">
<!-- Email Field -->
<div class="space-y-sm">
<label class="block font-label-sm text-label-sm text-outline uppercase" for="email">
                        Operator Email Address
                    </label>
<div class="relative flex items-center group bg-surface-container-low border border-outline-variant rounded-DEFAULT transition-all duration-150 input-border-focus">
<span class="material-symbols-outlined px-md text-outline group-focus-within:text-primary" data-icon="alternate_email">alternate_email</span>
<input class="w-full bg-transparent border-none focus:ring-0 text-on-surface font-code-md text-code-md py-md px-0 placeholder:text-surface-container-highest uppercase" id="email" name="email" placeholder="OPERATOR@GIAL.COM" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-sm">
<label class="block font-label-sm text-label-sm text-outline uppercase" for="password">
                        Security Access Code
                    </label>
<div class="relative flex items-center group bg-surface-container-low border border-outline-variant rounded-DEFAULT transition-all duration-150 input-border-focus">
<span class="material-symbols-outlined px-md text-outline group-focus-within:text-primary" data-icon="lock">lock</span>
<input class="w-full bg-transparent border-none focus:ring-0 text-on-surface font-code-md text-code-md py-md px-0 placeholder:text-surface-container-highest" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Action Button -->
<div class="pt-md">
<button class="w-full h-14 bg-primary-container hover:bg-primary text-on-primary font-headline-md text-headline-md rounded-lg flex items-center justify-center space-x-md transition-all active:scale-[0.98] group" type="submit">
<span>SIGN IN</span>
<span class="material-symbols-outlined group-hover:translate-x-1 transition-transform" data-icon="login">login</span>
</button>
</div>
</form>
</section>
<!-- Footer / Metadata Section -->
<footer class="w-full flex justify-between items-end border-t border-outline-variant pt-lg">
<div class="space-y-unit">
<div class="flex items-center space-x-sm">
<div class="w-2 h-2 bg-primary rounded-full animate-pulse"></div>
<span class="font-label-sm text-label-sm text-on-surface uppercase">System Status: Online</span>
</div>
<p class="font-code-md text-code-md text-outline text-[10px]">V.2.4.0-STABLE // BUILD_2024</p>
</div>
<div class="text-right">
<a class="font-label-sm text-label-sm text-outline hover:text-primary transition-colors block uppercase" href="#">Forgot Password?</a>
<a class="font-label-sm text-label-sm text-outline hover:text-primary transition-colors block uppercase mt-1" href="#">Request Access</a>
</div>
</footer>
</main>
<!-- Industrial Component Overlay (Floating Badge) -->
<div class="fixed bottom-margin-desktop right-margin-desktop hidden md:block">
<div class="border border-outline-variant p-sm flex items-center space-x-md bg-surface-container-low">
<div class="bg-surface-container-highest p-unit">
<span class="material-symbols-outlined text-primary text-sm" data-icon="verified_user">verified_user</span>
</div>
<div class="flex flex-col">
<span class="font-label-sm text-[10px] text-outline uppercase leading-none">Security Protocol</span>
<span class="font-code-md text-[10px] text-on-surface uppercase leading-none mt-1">AES-256 Encrypted</span>
</div>
</div>
</div>
<!-- Script for Micro-interactions -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.querySelector('form');
            const button = form.querySelector('button');

            button.addEventListener('click', (e) => {
                const inputs = form.querySelectorAll('input');
                let valid = true;
                inputs.forEach(input => {
                    if (!input.value) valid = false;
                });

                if (valid) {
                    button.innerHTML = `
                        <span class="material-symbols-outlined animate-spin" data-icon="sync">sync</span>
                        <span>AUTHENTICATING...</span>
                    `;
                    setTimeout(() => {
                        button.innerHTML = `
                            <span class="material-symbols-outlined" data-icon="check_circle">check_circle</span>
                            <span>ACCESS GRANTED</span>
                        `;
                        button.classList.replace('bg-primary-container', 'bg-tertiary-container');
                        button.classList.add('text-on-tertiary-container');
                    }, 1200);
                }
            });
        });
    </script>
</body></html>
